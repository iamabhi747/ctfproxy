[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfproxy"
version = "0.1.0"
description = "Effortless Team Connectivity"
authors = [
  { name="Abhinandan Bhuse", email="me@phoenixx.dev" },
]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ctfproxy = "ctfproxy.clientcli:main"
ctfproxy-host = "ctfproxy.hostcli:main"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"

